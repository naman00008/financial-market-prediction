version: '3.8'

services:
  market_ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_ml_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./cache:/app/cache
