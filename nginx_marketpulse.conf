server {
    listen 80;
    server_name _;

    # Client Request Body size limit for data uploads
    client_max_body_size 50M;

    # Root location routing all traffic to internal Python Tornado/Streamlit server
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical WebSocket Support for Real-time Reactive Streamlit UI
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Dedicated REST API Sync endpoint routing
    location /api/ {
        proxy_pass http://127.0.0.1:8501/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
